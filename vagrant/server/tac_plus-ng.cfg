# Лабораторная копия TACACS+/server/tac_plus-ng.cfg для ВМ Vagrant.
# Отличия: background = no (так процесс держит systemd с флагом -f),
# плюс device для 127.0.0.1 и сети host-only 192.168.56.0/24.
# Ключ этих двух device — lab-vagrant-key. Его же использует
# client/check_tacacs.py и фрагмент nas/cisco-ios.cfg.
# Пароли alice и bob лабораторные, как в учебном примере.

id = spawnd {
    # Слушать TACACS+ на всех IPv4-адресах, TCP/49.
    listen { address = 0.0.0.0 port = 49 }

    # systemd запускает процесс на переднем плане (tac_plus-ng -f).
    # background = yes здесь заставил бы демона уйти в фон, и юнит
    # решил бы, что служба сразу завершилась.
    background = no

    spawn {
        instances min = 1
        instances max = 8
    }
}

id = tac_plus-ng {
    # Маска новых файлов журнала: владелец читает и пишет, группа читает.
    umask = 0640

    # Каталоги месяца создаёт /usr/local/sbin/tacacs-logdirs до старта.
    log authclog { destination = /var/log/tac_plus-ng/authc/%Y/%m/%d.log }
    log authzlog { destination = /var/log/tac_plus-ng/authz/%Y/%m/%d.log }
    log acctlog  { destination = /var/log/tac_plus-ng/acct/%Y/%m/%d.log }

    authentication log = authclog
    authorization log = authzlog
    accounting log = acctlog

    # Учебная сеть из TACACS+/server/tac_plus-ng.cfg. На этой ВМ
    # пакеты с неё не приходят, записи оставлены, чтобы пример совпадал.
    device lab {
        address = 192.0.2.0/24
        key = "lab-default-key"
        enable 15 = clear "enable-lab-password"
        welcome banner = "\nLab TACACS+\n\n"

        device core-r1 {
            address = 192.0.2.21
            key = "core-r1-key"
        }

        device core-r2 {
            address = 192.0.2.22
            key = "core-r2-key"
        }

        device agg-vrp {
            address = 192.0.2.23
            key = "agg-vrp-key"
        }

        device border-mx {
            address = 192.0.2.24
            key = "border-mx-key"
        }
    }

    # Проверка с самой ВМ: источник TCP на 127.0.0.1 — этот адрес.
    device vagrant-local {
        address = 127.0.0.1
        key = "lab-vagrant-key"
    }

    # Хост Windows и NAS в сети VirtualBox host-only.
    # Типичный адрес хоста — 192.168.56.1.
    device vagrant-net {
        address = 192.168.56.0/24
        key = "lab-vagrant-key"
        enable 15 = clear "enable-lab-password"
        welcome banner = "\nLab TACACS+\n\n"
    }

    profile admins {
        script {
            if (service == shell) {
                if (cmd == "") {
                    set priv-lvl = 15
                    permit
                }
                permit
            }
            if (service == junos-exec) {
                set local-user-name = remote
                permit
            }
        }
    }

    profile operators {
        script {
            if (service == shell) {
                if (cmd == "") {
                    set priv-lvl = 1
                    permit
                }
                if (cmd =~ /^show/) permit
                if (cmd =~ /^ping/) permit
                if (cmd =~ /^traceroute/) permit
                if (cmd =~ /^display/) permit
                deny
            }
            if (service == junos-exec) {
                set local-user-name = remote-ro
                permit
            }
        }
    }

    group admins
    group operators

    user alice {
        password login = clear "alice-lab-password"
        member = admins
    }

    user bob {
        password login = clear "bob-lab-password"
        member = operators
    }

    ruleset {
        rule by-role {
            enabled = yes
            script {
                if (member == admins) {
                    profile = admins
                    permit
                }
                if (member == operators) {
                    profile = operators
                    permit
                }
                deny
            }
        }
    }
}
