! Пример настройки Cisco IOS / IOS-XE под TACACS+ с уровнями 15 / 7 / 1
! IP сервера и ключ замени на свои

! Локальный бэкап до списков AAA, иначе при обрыве TACACS+ на устройство не зайти.
username backup privilege 15 secret СильныйПароль123
enable secret СильныйПароль123

aaa new-model

! ==================== TACACS сервер ====================
tacacs server TACACS
 address ipv4 10.0.0.50
 key 0 твой_секретный_ключ
 timeout 5
 single-connection

aaa group server tacacs+ TACACS_GROUP
 server name TACACS

! ==================== AAA ====================
aaa authentication login default group TACACS_GROUP local
aaa authentication enable default group TACACS_GROUP enable
! Консоль не спрашивает TACACS+.
aaa authentication login CONSOLE local

! local и if-authenticated — если группа не ответила, не вторая попытка после явного deny.
aaa authorization exec default group TACACS_GROUP local if-authenticated
aaa authorization commands 1 default group TACACS_GROUP local if-authenticated
aaa authorization commands 7 default group TACACS_GROUP local if-authenticated
aaa authorization commands 15 default group TACACS_GROUP local if-authenticated
! Без этой строки команды режима конфигурации на сервер не уходят.
aaa authorization config-commands

aaa accounting exec default start-stop group TACACS_GROUP
aaa accounting commands 1 default start-stop group TACACS_GROUP
aaa accounting commands 7 default start-stop group TACACS_GROUP
aaa accounting commands 15 default start-stop group TACACS_GROUP

! Сессия оператора приходит с priv-lvl 7. configure и команды конфигурации
! по умолчанию уровень 15: IOS их не выполнит, пока уровень не снижен.
! show уже уровень 1. no shutdown — та же команда shutdown.
privilege exec level 7 configure
privilege exec level 7 configure terminal
privilege configure level 7 interface
privilege configure level 7 vlan
privilege interface level 7 description
privilege interface level 7 switchport
privilege interface level 7 shutdown

line con 0
 login authentication CONSOLE
! Авторизацию команд на консоли не включаем: при падении TACACS+ консоль локальная.

! На старом IOS с пятью VTY это line vty 0 4.
line vty 0 15
 login authentication default
 authorization exec default
 transport input ssh

! Проверка: test aaa group TACACS_GROUP имя_юзера пароль new-code
