! Пример настройки Cisco IOS / IOS-XE под TACACS+ с уровнями 15 / 7 / 1
! IP сервера и ключ замени на свои

! ==================== TACACS сервер ====================
tacacs server TACACS
 address ipv4 10.0.0.50
 key 0 твой_секретный_ключ
 timeout 5
 single-connection

aaa group server tacacs+ TACACS_GROUP
 server name TACACS

! ==================== AAA ====================
aaa new-model

aaa authentication login default group TACACS_GROUP local
aaa authentication enable default group TACACS_GROUP enable

aaa authorization exec default group TACACS_GROUP local
aaa authorization commands 1 default group TACACS_GROUP local
aaa authorization commands 7 default group TACACS_GROUP local
aaa authorization commands 15 default group TACACS_GROUP local

aaa accounting exec default start-stop group TACACS_GROUP
aaa accounting commands 1 default start-stop group TACACS_GROUP
aaa accounting commands 7 default start-stop group TACACS_GROUP
aaa accounting commands 15 default start-stop group TACACS_GROUP

! ==================== Локальный бэкап ====================
username backup privilege 15 secret СильныйПароль123
enable secret СильныйПароль123

line con 0
 login authentication default
 authorization exec default

line vty 0 4
 login authentication default
 authorization exec default
 transport input ssh

! Проверка: test aaa group TACACS_GROUP имя_юзера пароль legacy
