# Пример tac_plus-ng с Active Directory и тремя уровнями доступа
# Группы в AD: CN=ADMIN, CN=OPERATOR, CN=READONLY
# Проверка: tac_plus-ng -P этот-файл
# mavistest -d -1 этот-файл tac_plus-ng TACPLUS username password

id = spawnd {
    listen = { port = 49 }
    spawn = {
        instances min = 1
        instances max = 10
    }
}

id = tac_plus-ng {
    # Имя слева — объект log, путь только в destination.
    # authentication log и access log пишут в один канал (аутентификация),
    # поэтому оба имени оставлены и события попадают в оба файла.
    log accesslog { destination = /var/log/tac_plus/access/%Y%m%d.log }
    log authlog { destination = /var/log/tac_plus/auth/%Y%m%d.log }
    log authorlog { destination = /var/log/tac_plus/author/%Y%m%d.log }
    log acctlog { destination = /var/log/tac_plus/acct/%Y%m%d.log }
    access log = accesslog
    authentication log = authlog
    authorization log = authorlog
    accounting log = acctlog

    # ==================== AD / LDAP ====================
    # Скрипт mavis_tacplus-ng_ldap.pl. Переменные старого mavis_tacplus_ldap.pl
    # (LDAP_SERVER_TYPE, AD_GROUP_PREFIX, REQUIRE_*, UNLIMIT_*) он не читает:
    # тип каталога определяет сам, имя группы берёт из memberOf.
    mavis module = external {
        setenv LDAP_HOSTS = "ldaps://dc.company.local:636"   # или IP, или :389 если без TLS
        setenv LDAP_BASE = "DC=company,DC=local"
        setenv LDAP_SCOPE = sub
        setenv LDAP_FILTER = "(&(objectClass=user)(sAMAccountName=%s))"
        setenv LDAP_USER = "svc_tacacs@company.local"
        setenv LDAP_PASSWD = "пароль_сервис_аккаунта"

        # CN=ADMIN,OU=... -> группа ADMIN. Остальные memberOf отбрасываются.
        # Регистр CN должен совпасть с group ниже: сравнение member == чувствительно к нему.
        setenv LDAP_MEMBEROF_REGEX = "^CN=(ADMIN|OPERATOR|READONLY),"

        exec = /usr/local/lib/mavis/mavis_tacplus-ng_ldap.pl
    }

    user backend = mavis
    login backend = mavis
    pap backend = mavis

    device = world {
        address = 0.0.0.0/0
        key = "твой_секретный_ключ"
    }

    # ==================== УРОВНИ ДОСТУПА ====================

    # Полный админ (уровень 15)
    profile admin_15 {
        script {
            if (service == shell) {
                set priv-lvl = 15
                permit
            }
        }
    }

    # Оператор (уровень 7) — интерфейсы, VLAN, но без глобального конфига.
    # IOS шлёт каждую строку отдельно. priv-lvl берётся из ответа на пустой cmd
    # (старт оболочки). configure terminal — только вход в режим: без этой
    # строки interface/vlan не набрать, а сама она ещё ничего не меняет.
    # description, switchport, shutdown приходят уже из подрежима и только
    # если на NAS включён aaa authorization config-commands.
    # Команды конфигурации на IOS по умолчанию уровня 15. Сессия с priv 7 их
    # не выполнит, пока уровень не снижен (privilege exec level 7 configure
    # и configure terminal, то же для interface/vlan и подкоманд).
    profile operator_7 {
        script {
            if (service == shell) {
                if (cmd == "") {
                    set priv-lvl = 7
                    permit
                }
                if (cmd =~ /^write/) deny
                if (cmd =~ /^copy/) deny
                if (cmd =~ /^reload/) deny
                if (cmd =~ /^erase/) deny
                if (cmd =~ /^delete/) deny
                if (cmd =~ /^show/) permit
                if (cmd =~ /^configure terminal$/) permit
                if (cmd =~ /^(no )?interface( |$)/) permit
                if (cmd =~ /^(no )?vlan( |$)/) permit
                if (cmd =~ /^(no )?description( |$)/) permit
                if (cmd =~ /^(no )?switchport( |$)/) permit
                if (cmd =~ /^(no )?shutdown$/) permit
                if (cmd =~ /^exit$/) permit
                if (cmd =~ /^end$/) permit
                deny
            }
            deny
        }
    }

    # Только чтение (уровень 1)
    profile readonly_1 {
        script {
            if (service == shell) {
                set priv-lvl = 1
                if (cmd == "") permit
                if (cmd =~ /^show/) permit
                if (cmd =~ /^exit/) permit
                if (cmd =~ /^logout/) permit
                deny
            }
        }
    }

    # member == ищет группу, объявленную здесь. Имя приходит из CN (см. LDAP_MEMBEROF_REGEX).
    group ADMIN {}
    group OPERATOR {}
    group READONLY {}

    # ==================== ПРАВИЛА ====================
    # Первое совпадение окончательное: кто в нескольких группах AD, получает верхнюю.
    ruleset {
        rule {
            script {
                # Приоритет сверху вниз
                if (member == ADMIN)     { profile = admin_15    permit }
                if (member == OPERATOR)  { profile = operator_7  permit }
                if (member == READONLY)  { profile = readonly_1  permit }
                deny
            }
        }
    }
}
