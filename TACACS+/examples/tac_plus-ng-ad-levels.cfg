# Пример tac_plus-ng с Active Directory и тремя уровнями доступа
# Группы в AD: ADMIN, OPERATOR, READONLY
# Проверка: tac_plus-ng -P этот-файл
# mavistest -d -1 этот-файл tac_plus-ng TACPLUS username password

id = spawnd {
    listen = { port = 49 }
    spawn = {
        instances min = 1
        instances max = 10
    }
}

id = tac_plus-ng {
    access log = /var/log/tac_plus/access/%Y%m%d.log
    accounting log = /var/log/tac_plus/acct/%Y%m%d.log
    authentication log = /var/log/tac_plus/auth/%Y%m%d.log

    # ==================== AD / LDAP ====================
    mavis module = external {
        setenv LDAP_SERVER_TYPE = "microsoft"
        setenv LDAP_HOSTS = "ldaps://dc.company.local:636"   # или IP, или :389 если без TLS
        setenv LDAP_BASE = "DC=company,DC=local"
        setenv LDAP_SCOPE = sub
        setenv LDAP_FILTER = "(&(objectClass=user)(sAMAccountName=%s))"
        setenv LDAP_USER = "svc_tacacs@company.local"
        setenv LDAP_PASSWD = "пароль_сервис_аккаунта"

        setenv AD_GROUP_PREFIX = ""
        setenv UNLIMIT_AD_GROUP_MEMBERSHIP = 1
        setenv REQUIRE_TACACS_GROUP_PREFIX = 0

        exec = /usr/local/lib/mavis/mavis_tacplus-ng_ldap.pl
    }

    user backend = mavis
    login backend = mavis
    pap backend = mavis

    device = world {
        address = 0.0.0.0/0
        key = "твой_секретный_ключ"
    }

    # ==================== УРОВНИ ДОСТУПА ====================

    # Полный админ (уровень 15)
    profile admin_15 {
        script {
            if (service == shell) {
                set priv-lvl = 15
                permit
            }
        }
    }

    # Оператор (уровень 7) — интерфейсы, VLAN, но без глобального конфига
    profile operator_7 {
        script {
            if (service == shell) {
                set priv-lvl = 7
                if (cmd == "") permit
                if (cmd =~ /^show/) permit
                if (cmd =~ /^interface/) permit
                if (cmd =~ /^vlan/) permit
                if (cmd =~ /^exit/) permit
                if (cmd =~ /^end/) permit
                if (cmd =~ /^configure terminal/) deny
                if (cmd =~ /^write/) deny
                if (cmd =~ /^reload/) deny
                permit
            }
        }
    }

    # Только чтение (уровень 1)
    profile readonly_1 {
        script {
            if (service == shell) {
                set priv-lvl = 1
                if (cmd == "") permit
                if (cmd =~ /^show/) permit
                if (cmd =~ /^exit/) permit
                if (cmd =~ /^logout/) permit
                deny
            }
        }
    }

    # ==================== ПРАВИЛА ====================
    ruleset {
        rule {
            # Приоритет сверху вниз
            if (member == ADMIN)     { profile = admin_15    permit }
            if (member == OPERATOR)  { profile = operator_7  permit }
            if (member == READONLY)  { profile = readonly_1  permit }
            deny
        }
    }
}
