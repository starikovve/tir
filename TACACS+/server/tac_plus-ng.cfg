# tac_plus-ng (Marc Huber, event-driven-servers / pro-bono-publico).
# Синтаксис — руководство tac_plus-ng, раздел Configuration.
# Проверка без запуска демона: tac_plus-ng -P этот-файл
# Лабораторные пароли и ключи. В бою их заменяют и не коммитят.

id = spawnd {
    # Слушать TACACS+ на всех IPv4-адресах, TCP/49 (порт по умолчанию у NAS).
    listen { address = 0.0.0.0 port = 49 }

    # Уйти в фон после старта. Для отладки в терминале поставьте no.
    background = yes

    # Пул рабочих процессов: минимум один, не больше восьми.
    spawn {
        instances min = 1
        instances max = 8
    }
}

id = tac_plus-ng {
    # Маска новых файлов журнала: владелец читает и пишет, группа читает.
    umask = 0640

    # Каталоги создайте заранее. %Y/%m/%d — новый файл каждый день (strftime).
    log authclog { destination = /var/log/tac_plus-ng/authc/%Y/%m/%d.log }
    log authzlog { destination = /var/log/tac_plus-ng/authz/%Y/%m/%d.log }
    log acctlog  { destination = /var/log/tac_plus-ng/acct/%Y/%m/%d.log }

    # Какой из именованных log куда писать.
    authentication log = authclog
    authorization log = authzlog
    accounting log = acctlog

    # --- NAS (в этом демоне объект называется device, не host) ---
    # Родитель покрывает лабораторную подсеть и отдаёт ключ наследникам,
    # если у конкретного адреса ключ не переопределён.
    device lab {
        address = 192.0.2.0/24
        key = "lab-default-key"
        # Пароль enable 15, если NAS спрашивает его у TACACS+ ($enab15$ / enable).
        enable 15 = clear "enable-lab-password"
        welcome banner = "\nLab TACACS+\n\n"

        # Ядро, Cisco. Свой ключ важнее ключа сети 192.0.2.0/24.
        device core-r1 {
            address = 192.0.2.21
            key = "core-r1-key"
        }

        device core-r2 {
            address = 192.0.2.22
            key = "core-r2-key"
        }

        # Huawei VRP. Тот же TCP/49, атрибут priv-lvl в service shell.
        device agg-vrp {
            address = 192.0.2.23
            key = "agg-vrp-key"
        }

        # Junos. Авторизация приходит как service junos-exec, не shell.
        device border-mx {
            address = 192.0.2.24
            key = "border-mx-key"
        }
    }

    # Профиль полной админской сессии. Назначается правилом, не пользователем.
    profile admins {
        script {
            # Cisco IOS/IOS-XE и Huawei VRP: старт оболочки, команды ещё нет.
            if (service == shell) {
                if (cmd == "") {
                    # Уровень 15 — полный exec и конфигурация на IOS.
                    set priv-lvl = 15
                    permit
                }
                # Любая дальнейшая команда этой сессии разрешена.
                permit
            }
            # Junos: имя локального шаблона, его class задаёт права на устройстве.
            if (service == junos-exec) {
                set local-user-name = remote
                permit
            }
        }
    }

    # Только чтение. Команды, не попавшие в permit, отклоняются (deny в конце).
    profile operators {
        script {
            if (service == shell) {
                if (cmd == "") {
                    # Уровень 1 — пользовательский exec, без конфигурации.
                    set priv-lvl = 1
                    permit
                }
                # IOS: show/ping/traceroute. VRP: display. Аргументы входят в cmd.
                if (cmd =~ /^show/) permit
                if (cmd =~ /^ping/) permit
                if (cmd =~ /^traceroute/) permit
                if (cmd =~ /^display/) permit
                deny
            }
            if (service == junos-exec) {
                # Шаблон remote-ro на устройстве: class только на просмотр.
                set local-user-name = remote-ro
                permit
            }
        }
    }

    # Пустые группы-роли. Пользователь входит в них через member.
    group admins
    group operators

    user alice {
        # clear — пароль в файле открытым текстом. В бою: crypt / pbkdf2 или MAVIS.
        password login = clear "alice-lab-password"
        member = admins
    }

    user bob {
        password login = clear "bob-lab-password"
        member = operators
    }

    # Какую роль во что превратить. Профиль на user отключает этот ruleset.
    ruleset {
        rule by-role {
            enabled = yes
            script {
                # member — членство в группе (пользователь может состоять в нескольких).
                if (member == admins) {
                    profile = admins
                    permit
                }
                if (member == operators) {
                    profile = operators
                    permit
                }
                # Нет группы — нет профиля. Демон по умолчанию запрещает авторизацию.
                deny
            }
        }
    }

    # Внешние учётки (PAM/LDAP) подключаются модулем MAVIS, например:
    # mavis module external {
    #     exec = /usr/local/sbin/pammavis "pammavis" "-s" "sshd"
    # }
    # user backend = mavis
    # login backend = mavis
}
