# Классический tac_plus (Shrubbery / пакет tacacs+).
# Тот же смысл, что у tac_plus-ng.cfg: два NAS, две роли, журнал учёта.
# Это другой язык конфигурации. Не скармливайте этот файл tac_plus-ng.
# Порядок: ключ и учёт, затем host, затем group, затем user.

# Запасной ключ, если адрес NAS не попал ни в один host.
key = "lab-default-key"

# Единственное место назначения accounting. Каталог должен существовать.
accounting file = /var/log/tac_plus/tac_plus.acct

# Дополнительно дублировать учёт в syslog (facility задаётся директивой logging).
accounting syslog;

# NAS задаётся адресом. Свой key заменяет глобальный для этого клиента.
host = 192.0.2.21 {
    key = "core-r1-key"
    prompt = "Username: "
}

host = 192.0.2.22 {
    key = "core-r2-key"
}

host = 192.0.2.23 {
    key = "agg-vrp-key"
}

host = 192.0.2.24 {
    key = "border-mx-key"
}

# priv 15 и полный набор команд. default service обязан стоять до service/cmd.
group = admins {
    default service = permit
    service = exec {
        priv-lvl = 15
    }
    # Junos забирает локальный шаблон из этого сервиса, не из priv-lvl.
    service = junos-exec {
        local-user-name = remote
    }
}

# Уровень 1 и явный список команд. Имя команды — это ключ cmd, не регулярное выражение.
# Строки permit/deny внутри cmd сравниваются с аргументами.
group = operators {
    default service = deny
    service = exec {
        priv-lvl = 1
    }
    cmd = show {
        permit .*
    }
    cmd = ping {
        permit .*
    }
    cmd = traceroute {
        permit .*
    }
    cmd = display {
        permit .*
    }
    service = junos-exec {
        local-user-name = remote-ro
    }
}

user = alice {
    # cleartext хранит пароль открыто. des/pam — альтернативы этой ветки демона.
    login = cleartext "alice-lab-password"
    name = "Alice Admin"
    member = admins
}

user = bob {
    login = cleartext "bob-lab-password"
    name = "Bob Operator"
    member = operators
}

# Отдельный пароль enable, когда IOS спрашивает уровень 15 у TACACS+.
user = $enab15$ {
    login = cleartext "enable-lab-password"
}
