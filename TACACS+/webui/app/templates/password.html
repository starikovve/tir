{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block body %}
<h1>Смена своего пароля</h1>
<p class="muted">Меняется только пароль входа в веб-интерфейс. Пароль в tac_plus-ng.cfg остаётся прежним.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/account/password">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label>Текущий пароль <input name="current_password" type="password" autocomplete="current-password" required></label>
  <label>Новый пароль <input name="new_password" type="password" autocomplete="new-password" required></label>
  <label>Новый пароль ещё раз <input name="new_password_again" type="password" autocomplete="new-password" required></label>
  <button type="submit">Сохранить</button>
</form>
{% endblock %}
